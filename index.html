<script>
"use strict";
const M = JSON.parse(document.getElementById('data').textContent);
const fold = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
for (const m of M) m._k = fold([m.f1,m.a1,m.f2,m.a2,m.cat,m.round,m.no,m.mat,m.day].join(' '));
// Pure filter function (tested headlessly with node): state = {q, academy, athlete, day, onlyvid}
function filterMatches(M, st){
  const words = fold(st.q).split(/\s+/).filter(Boolean);
  return M.filter(m =>
    words.every(w => m._k.includes(w)) &&
    (!st.academy || m.a1 === st.academy || m.a2 === st.academy) &&
    (!st.athlete || m.f1 === st.athlete || m.f2 === st.athlete) &&
    (!st.day || m.day === st.day) &&
    (!st.onlyvid || !!m.url));
}
if (typeof module !== 'undefined') module.exports = {filterMatches, fold};
if (typeof document !== 'undefined' && document.getElementById('rows')) {
  const $ = id => document.getElementById(id);
  const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const st = {q:'', academy:'', athlete:'', day:'', onlyvid:false};
  const acad = [...new Set(M.flatMap(m => [m.a1,m.a2]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fi'));
  for (const a of acad) { const n = M.filter(m=>m.a1===a||m.a2===a).length; $('academy').add(new Option(`${a} (${n})`, a)); }
  const days = [...new Set(M.map(m=>m.day))];
  for (const d of days) $('day').add(new Option(d, d));
  if (days.length < 2) $('day').style.display = 'none';   // pointless with a single day
  const side = (f,a,win) => `<span class="lnk ath${win?' win':''}" data-ath="${esc(f)}">${esc(f)}</span><br><small class="lnk" data-acad="${esc(a)}">${esc(a)}</small>`;
  function render(){
    const r = filterMatches(M, st);
    $('rows').innerHTML = r.map(m => `<tr><td>${esc(m.day)}<br><b>${esc(m.mat)}</b></td><td>${esc(m.no)}</td><td>${esc(m.time)}</td>
      <td>${esc(m.cat)}<br><small>${esc(m.round)}</small></td><td>${side(m.f1,m.a1,m.win===m.f1&&m.f1)}</td><td>${side(m.f2,m.a2,m.win===m.f2&&m.f2)}</td>
      <td>${esc(m.res)}<br><small>${esc(m.tp)}</small></td>
      <td>${m.url ? `<a class="watch" href="${esc(m.url)}" target="_blank" rel="noopener">▶ Watch ${esc(m.vt)}</a> ${m.ok?'✔':''}` : `<span class="na">${esc(m.status)}</span>`}</td></tr>`).join('');
    $('count').textContent = `${r.length} match${r.length===1?'':'es'} found`;
    $('chip').style.display = st.athlete ? 'inline' : 'none'; $('chiptxt').textContent = st.athlete ? 'Athlete: ' + st.athlete : '';
    const h = new URLSearchParams(Object.entries(st).filter(([k,v])=>v).map(([k,v])=>[k,String(v)])).toString();
    history.replaceState(null, '', h ? '#' + h : location.pathname);
  }
  // restore filters from URL hash so filtered views can be shared
  const hp = new URLSearchParams(location.hash.slice(1));
  for (const k of ['q','academy','athlete','day']) if (hp.get(k)) st[k] = hp.get(k);
  st.onlyvid = hp.get('onlyvid') === 'true';
  $('q').value = st.q; $('academy').value = st.academy; $('day').value = st.day; $('onlyvid').checked = st.onlyvid;
  $('q').oninput = e => { st.q = e.target.value; render(); };
  $('academy').onchange = e => { st.academy = e.target.value; render(); };
  $('day').onchange = e => { st.day = e.target.value; render(); };
  $('onlyvid').onchange = e => { st.onlyvid = e.target.checked; render(); };
  $('chipx').onclick = () => { st.athlete = ''; render(); };
  $('rows').onclick = e => {
    const t = e.target;
    if (t.dataset.ath) { st.athlete = t.dataset.ath; st.q = ''; $('q').value = ''; render(); scrollTo(0,0); }
    else if (t.dataset.acad) { st.academy = t.dataset.acad; st.athlete = ''; st.q = ''; $('q').value = ''; $('academy').value = st.academy; render(); scrollTo(0,0); }
  };
  render();
  // ---------- Statistics tab ----------
  const S = JSON.parse($('stats').textContent || 'null');
  let sday = 'All';
  const pct = (a,b) => b ? Math.round(100*a/b) : 0;

  const who = m => `<b>${esc(m.f1)}</b> <small>(${esc(m.a1)})</small> vs <b>${esc(m.f2)}</b> <small>(${esc(m.a2)})</small>`;
  const meta = m => `<small>${esc(m.day.split(' ')[0])} · ${esc(m.mat)} · #${esc(m.no)} · ${esc(m.cat)} ${esc(m.round)}</small>`;
  const tech = m => m.tech ? esc(m.tech) + (m.tech_src==='video' ? ' <span class="tag">from video</span>' : '') : '<i>unspecified</i>';
  const bars = (rows,tot) => '<table>' + rows.map(([k,v]) => `<tr><td>${esc(k)}</td><td style="width:45%"><div class="barw"><i style="width:${pct(v,tot)}%"></i></div></td><td>${v}</td><td><small>${pct(v,tot)}%</small></td></tr>`).join('') + '</table>';
  function renderStats(){
    if (!S) { $('tab-stats').innerHTML = '<p>No statistics available.</p>'; return; }
    const d = S.sections[sday], named = d.techniques.reduce((a,[,v])=>a+v,0);
    const rare = d.techniques.length ? d.techniques[d.techniques.length-1] : null, top = d.techniques[0];
    const dayOpts = ['All', ...S.days].map(x => `<option value="${esc(x)}"${x===sday?' selected':''}>${x==='All'?'Both days':esc(x)}</option>`).join('');
    const f0 = d.fastest[0];
    let h = `<div class="bar"><select id="sday">${dayOpts}</select></div>
    <div class="kpis"><div class="kpi"><b>${d.matches}</b>matches</div><div class="kpi"><b>${d.subs}</b>submissions (${d.sub_rate}% of fought)</div>
    <div class="kpi"><b>${top?esc(top[0]):'–'}</b>most common named submission${top?` (${top[1]})`:''}</div>
    <div class="kpi"><b>${f0?esc(f0.time):'–'}</b>fastest submission${f0?` – ${esc(f0.winner)}`:''}</div>
    <div class="kpi"><b>${esc(d.avg_sub_time||'–')}</b>average time to submission</div>${d.ages?`<div class="kpi"><b>${d.ages.overall_avg==null?'–':Number(d.ages.overall_avg).toFixed(1)}</b>average age (n=${d.ages.n}/${d.ages.total})</div>`:''}</div><div class="grid">`;
    h += `<div class="card"><h3>Win methods</h3>${bars(d.methods, d.fought)}<small>Points wins with equal points are listed as Advantages, Penalties or Referee decision.</small></div>`;
    h += `<div class="card"><h3>Submission types</h3>${d.techniques.length ? bars(d.techniques, named) : '<p>No named submissions.</p>'}
      <p><small>Most common: <b>${top?esc(top[0]):'–'}</b>. Rarest: <b>${d.techniques.filter(t=>t[1]===(rare||[])[1]).map(t=>esc(t[0])).join(', ')||'–'}</b>.<br>
      Only ${named} of ${d.subs} submissions have a named technique. Smoothcomp says just “submission” for <b>${d.tech_unknown}</b>; these stay <i>unspecified</i> and are never guessed.
      ${d.tech_from_video} were identified from video.</small></p></div>`;
    h += `<div class="card"><h3>⚡ Fastest submissions</h3><ol class="lst">${d.fastest.map(m => `<li><b>${esc(m.time)}</b> – ${esc(m.winner)} · ${tech(m)}<br>${who(m)}<br>${meta(m)}<br>${clip(m.clip,'Watch finish')}</li>`).join('')}</ol></div>`;
    h += `<div class="card"><h3>🔥 Highest-scoring matches</h3><ol class="lst">${d.highest.map(m => `<li><b>${esc(m.score)}</b> (${m.total} pts) – winner ${esc(m.winner)}<br>${who(m)}<br>${meta(m)}<br>${clip(m.clip,'Watch')}</li>`).join('')}</ol></div>`;
    h += `<div class="card"><h3>Submissions by division</h3><table><tr><th>Division</th><th>Belt</th><th>Matches</th><th>Subs</th><th>Sub %</th></tr>${d.by_division.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}%</td></tr>`).join('')}</table></div>`;
    h += `<div class="card"><h3>🏅 Academy leaderboard</h3><small>Sorted by wins. Sub % = share of wins by submission. Click an academy to see its matches.</small>
      <table><tr><th>#</th><th>Academy</th><th>W</th><th>L</th><th>Win %</th><th>Subs</th><th>Sub %</th></tr>${d.academies.slice(0,25).map((r,i) => `<tr><td>${i+1}</td><td class="lnk" data-acad="${esc(r[0])}">${esc(r[0])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[5]}%</td><td>${r[4]}</td><td>${r[6]}%</td></tr>`).join('')}</table></div>`;
    if (d.ages) {
      const A = d.ages, avg = x => x==null ? '–' : Number(x).toFixed(1);
      h += `<div class="card"><h3>Average age</h3>
        <p><b>${avg(A.overall_avg)}</b> years overall <small>(n = ${A.n} of ${A.total} unique athletes)</small></p>
        <p><small>${esc(S.ages_note||'')}</small></p>
        <h4>By belt rank</h4>
        <table><tr><th>Division</th><th>Belt</th><th>Average age</th><th>n</th><th>Athletes</th></tr>
        ${A.by_belt.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${avg(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table>
        <h4>By category</h4>
        <table><tr><th>Category</th><th>Average age</th><th>n</th><th>Athletes</th></tr>
        ${A.by_category.map(r => `<tr><td>${esc(r[0])}</td><td>${avg(r[1])}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</table></div>`;
    }
    if (S.bb && S.bb.divisions.length) {
      const B = S.bb, O = B.overall;
      const mt = rows => '<table>' + rows.map(([k,v,p]) => `<tr><td>${esc(k)}</td><td style="width:40%"><div class="barw"><i style="width:${p}%"></i></div></td><td>${v}</td><td><small>${p}%</small></td></tr>`).join('') + '</table>';
      const tq = t => `${t.named.length ? t.named.map(([k,v]) => `${esc(k)} ${v}`).join(' · ') + ' · ' : ''}<i>unspecified</i> ${t.unspecified}<br><small>${t.subs} submissions; Smoothcomp names the technique for ${t.subs - t.unspecified}${t.from_video ? `, ${t.from_video} identified from video` : ''}. Unspecified ones are not guessed.</small>`;
      const fq = arr => arr.length ? arr.map(m => `<b>${esc(m.time)}</b> – ${esc(m.winner)} · ${tech(m)}<br>${who(m)}<br>${meta(m)}<br>${clip(m.clip,'Watch match')}`).join('') : '–';
      const at = rows => `<table><tr><th>Athlete</th><th>W–L</th><th>Subs</th><th>Sub %</th><th>Pts for–against</th></tr>${rows.map(a => `<tr><td><b>${esc(a.name)}</b><br><small>${esc(a.acad)}</small></td><td>${a.w}–${a.l}</td><td>${a.sub}</td><td>${a.sub_pct===null?'–':a.sub_pct+'%'}</td><td>${a.pf}–${a.pa}</td></tr>`).join('')}</table>`;
      const md = M => M ? `🥇 <b>${esc(M.gold[0])}</b> <small>(${esc(M.gold[1])})</small><br>🥈 ${esc(M.silver[0])} <small>(${esc(M.silver[1])})</small>${M.bronze.map(b => `<br>🥉 ${esc(b[0])} <small>(${esc(b[1])})</small>`).join('')}` : '–';

      h += `</div><h2 style="margin-top:1.2rem">🟫⬛ Brown & black belt divisions</h2><p><small>Men's brown & black and women's purple/brown/black (the highest belt divisions), including open weight. ${B.days.map(d=>esc(d.split(' ')[0])).join(', ')} only${sunday.length ? ` – ${sunday.map(d=>esc(d.split(' ')[0])).join(', ')} had no brown/black divisions` : ''}. Sub % = share of wins by submission. Medals are worked out from the bracket results: both semifinal losers get bronze; in 3-athlete divisions bronze is the third-placed athlete.</small></p>`;
      h += `<div class="kpis"><div class="kpi"><b>${O.matches}</b>matches in ${O.divisions} divisions</div><div class="kpi"><b>${O.athletes}</b>athletes</div>
        <div class="kpi"><b>${(O.methods.find(r=>r[0]==='Submission')||[0,0,0])[2]}%</b>won by submission (${(O.methods.find(r=>r[0]==='Submission')||[0,0])[1]})</div>
        <div class="kpi"><b>${O.fastest[0]?esc(O.fastest[0].time):'–'}</b>fastest submission${O.fastest[0]?` – ${esc(O.fastest[0].winner)}`:''}</div>
        <div class="kpi"><b>${O.double_gold.length}</b>double-gold winners</div></div><div class="grid">`;
      h += `<div class="card"><h3>Win methods – all brown/black</h3>${mt(O.methods)}</div>`;
      h += `<div class="card"><h3>Submission types – all brown/black</h3>${tq(O.techniques)}</div>`;
      h += `<div class="card"><h3>🥇🥇 Double gold (weight + open)</h3>${O.double_gold.length ? '<ol class="lst">' + O.double_gold.map(a => `<li><b>${esc(a.name)}</b> <small>(${esc(a.acad)})</small><br>${a.w}–${a.l}, ${a.sub} submissions, points ${a.pf}–${a.pa}<br><small>${a.cats.map(esc).join(' + ')}</small></li>`).join('') + '</ol>' : '<p>None.</p>'}</div>`;
      h += `<div class="card"><h3>⚡ Fastest submission – all brown/black</h3>${fq(O.fastest)}<p><small>Most submissions by one athlete: ${O.most_subs.map(r => `<b>${esc(r[0])}</b> <small>(${esc(r[1])})</small> ${r[2]} of ${r[3]} wins`).join(', ')||'–'}</small></p></div>`;
      h += `<div class="card"><h3>🏅 Academy medal table – brown/black</h3><table><tr><th>Academy</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Total</th></tr>${O.academy_medals.map(r => `<tr><td class="lnk" data-acad="${esc(r[0])}">${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[1]+r[2]+r[3]}</td></tr>`).join('')}</table></div>`;
      h += `<div class="card"><details><summary><b>Points scored vs conceded – all ${O.athletes} athletes</b></summary>${at(O.table)}</details></div></div>`;
      h += `<h3 style="margin-top:1rem">Per division</h3><div class="grid">` + B.divisions.map(d => `<div class="card"><h3>${esc(d.cat)}</h3>
        <p>${md(d.medals)}</p><p><small>${d.matches} matches · ${d.athletes} athletes</small></p>
        <details><summary>Win methods, submissions, fastest, athletes</summary>${mt(d.methods)}<p>${tq(d.techniques)}</p>
        <p><b>Fastest submission:</b> ${fq(d.fastest)}</p>${at(d.table)}</details></div>`).join('') + '</div><div>';
    }
    h += `</div><h2 style="margin-top:1.2rem">🥋 Throws</h2><p><small>Clips start 2–3 s before the throw.</small></p><div class="grid">`;
    const item = m => `<li><b>${esc(m.score)}</b> – ${esc(m.desc)}<br>${who(m)}<br>${meta(m)}<br>${clip(m.clip,'Watch')}</li>`;
    h += (S.best_throw||[]).map(m => `<div class="card thr best"><h3>🏆 Best throw</h3><ul class="lst" style="list-style:none;padding-left:0">${item(m)}</ul></div>`).join('');
    h += (S.other_throws||[]).length ? `<div class="card thr"><h3>Other great throws</h3><ol class="lst">${S.other_throws.map(item).join('')}</ol></div>` : '';
    h += '</div>';
    $('tab-stats').innerHTML = h;
    $('sday').onchange = e => { sday = e.target.value; renderStats(); };
  }
  function tab(t){
    $('tab-matches').style.display = t==='m' ? '' : 'none'; $('tab-stats').style.display = t==='s' ? '' : 'none';
    $('tbm').className = t==='m' ? 'on' : ''; $('tbs').className = t==='s' ? 'on' : '';
    if (t==='s') { renderStats(); history.replaceState(null, '', '#stats'); } else render();
  }
  $('tbm').onclick = () => tab('m'); $('tbs').onclick = () => tab('s');
  $('tab-stats').onclick = e => { const a = e.target.dataset && e.target.dataset.acad; if (a) { st.academy = a; st.athlete = ''; st.q = ''; $('q').value = ''; $('academy').value = a; tab('m'); scrollTo(0,0); } };
  if (location.hash === '#stats') tab('s');
}
</script></body></html>
